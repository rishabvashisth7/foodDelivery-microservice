spring:
  application:
    name: "orders-service"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    stream:
      bindings:
        orderCreated-out-0: 
          destination: order.event
          content-type: application/json
          group: ${spring.application.name}
        orderAcknowdged-in-0: 
          destination: order.acknow
          content-type: application/json
          group: ${spring.application.name}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 9097

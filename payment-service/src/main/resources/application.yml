spring:  
  application:
    name: "payment-service"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    stream:
      bindings:
        orderEvent-in-0: 
          destination: order.event
          content-type: application/json
          group: ${spring.application.name}
        orderacknowledge-out-0:
          destination: order.acknow
          content-type: application/json
          group: ${spring.application.name}